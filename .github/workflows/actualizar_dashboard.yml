name: Actualizar Dashboard
on:
  schedule:
    # 3 actualizaciones diarias (lunes a sabado), hora de Paraguay (GMT-3).
    # Uso minuto :20 en vez de :00 porque GitHub retrasa mucho los cron en punto
    # (alta carga). Aun asi puede haber algunos minutos de demora, es normal.
    - cron: '20 10 * * 1-6'   # 7:20 Paraguay (manana)
    - cron: '20 15 * * 1-6'   # 12:20 Paraguay (mediodia)
    - cron: '20 21 * * 1-6'   # 18:20 Paraguay (tarde)
  workflow_dispatch:          # Permite correrlo manualmente desde GitHub
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests openpyxl
      - name: Regenerar dashboard
        run: python regenerar_dashboard.py
      - name: Subir index.html actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Actualizacion automatica $(date '+%d/%m/%Y %H:%M')"
          git push
